llm:
  digest:
    provider: gemini
    model: gemini-2.5-flash
  writer:
    provider: gemini
    model: gemini-2.5-flash
  summary:
    provider: gemini
    model: gemini-2.5-flash

collectors:
  trend_provider: "google_trends"  # "google_trends" | "serpapi"
  google_trends:
    hl: "en-US"
    tz: 360
    timeframe: "today 3-m"
    sleep_seconds: 2
    max_retries: 3
    cooldown_minutes: 60
  serpapi:
    hl: "en"
    geo: "US"
    date: "today 3-m"
    cooldown_minutes: 60
    include_interest_over_time: false
  reddit:
    request_delay: 3.0
    limit: 10
    sort: "relevance"
    time_filter: "month"
    use_tavily: false
    max_results_per_query: 5
    max_queries_per_intent: 1
    time_range: "year"
    search_depth: "basic"
    preferred_subreddits:
      - "gifts"
      - "GiftIdeas"
      - "BuyItForLife"
      - "AskMen"
      - "AskWomen"
      - "Etsy"
    intents:
      ask:
        - "looking for {seed}"
        - "what should I get {seed}"
      pain:
        - "{seed} hard to choose"
        - "{seed} who has everything"
      regret:
        - "{seed} waste of money"
        - "regret buying {seed}"
      recommend:
        - "best {seed} worth it"
        - "{seed} actually use"
  web_search:
    max_results: 5
  google_suggest:
    client: "firefox"
    hl: "en"

cache:
  enabled: true
  ttl_days: 1
  raw_dir: "data/raw"
  evidence_dir: "data/evidence"

reporting:
  output_dir: "reports"
  template_path: "src/render/report.md.j2"
