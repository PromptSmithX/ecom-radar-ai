llm:
  digest:
    provider: gemini
    model: gemini-2.5-flash
  writer:
    provider: gemini
    model: gemini-2.5-flash
  summary:
    provider: gemini
    model: gemini-2.5-flash

collectors:
  google_trends:
    hl: "en-US"
    tz: 360
    timeframe: "today 3-m"
    sleep_seconds: 2
    max_retries: 3
    cooldown_minutes: 60
  reddit:
    max_results_per_query: 5
    time_range: "year"
    search_depth: "advanced"
    preferred_subreddits:
      - "gifts"
      - "GiftIdeas"
      - "BuyItForLife"
      - "AskMen"
      - "AskWomen"
      - "Etsy"
    intents:
      ask:
        - "looking for {seed}"
        - "what should I get {seed}"
      pain:
        - "{seed} hard to choose"
        - "{seed} who has everything"
      regret:
        - "{seed} waste of money"
        - "regret buying {seed}"
      recommend:
        - "best {seed} worth it"
        - "{seed} actually use"
  web_search:
    max_results: 5
  google_suggest:
    client: "firefox"
    hl: "en"

cache:
  enabled: true
  ttl_days: 1
  raw_dir: "data/raw"
  evidence_dir: "data/evidence"

reporting:
  output_dir: "reports"
  template_path: "src/render/report.md.j2"
