llm:
  digest:
    provider: gemini
    model: gemini-2.5-flash
  writer:
    provider: gemini
    model: gemini-2.5-flash
  summary:
    provider: gemini
    model: gemini-2.5-flash

collectors:
  trend_provider: "google_trends"  # "google_trends" | "serpapi"
  google_trends:
    hl: "en-US"
    tz: 360
    timeframe: "today 3-m"
    sleep_seconds: 2
    max_retries: 3
    cooldown_minutes: 60
  serpapi:
    hl: "en"
    geo: "US"
    date: "today 3-m"
    cooldown_minutes: 60
    include_interest_over_time: false
  reddit:
    max_results_per_query: 8
    preferred_subreddits:
      - "gifts"
      - "GiftIdeas"
      - "BuyItForLife"
      - "AskMen"
      - "AskWomen"
  amazon:
    enabled: true
    max_results: 8
    region_domain: "www.amazon.com"
  etsy:
    enabled: true
    max_results: 8
  web_search:
    max_results: 5
  google_suggest:
    client: "firefox"
    hl: "en"
    providers:
      - "google"
      - "duckduckgo"
      - "bing"
    request_delay: 1.0
    max_suggestions: 6

digest:
  max_items: 25
  max_items_llm: 35
  source_priority:
    - "reddit"
    - "amazon"
    - "etsy"
    - "serpapi_trends"
    - "google_trends"
    - "web_search"
    - "google_suggest"

cache:
  enabled: true
  ttl_days: 1
  raw_dir: "data/raw"
  evidence_dir: "data/evidence"

reporting:
  output_dir: "reports"
  template_path: "src/render/report.md.j2"
