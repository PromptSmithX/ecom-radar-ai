[pytest]
; On this Windows setup, pytest's default base temp dir
; (%TEMP%\pytest-of-<user>) is a stale directory with a denied ACL that neither
; pytest, icacls, nor `rm -rf` can touch. tmp_path/tmp_path_factory fail at fixture
; setup for every test as a result. Keeping pytest's temp dirs inside the project
; avoids that broken OS path entirely.
addopts = --basetemp=.pytest_tmp
